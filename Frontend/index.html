<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <!-- External splash CSS avoids Vite html-inline-proxy Windows path bugs during build -->
  <link rel="stylesheet" href="/initial-splash.css" />
  <title>ItzoFood</title>
</head>

<body>
  <div id="initial-splash">
    <img id="initial-splash-img" src="/useritzo.png" alt="ItzoFood Logo" />
  </div>
  <script>
    // Splash image per panel (files in /public), picked from the URL before the app boots.
    (function () {
      var p = location.pathname;
      var src = '/useritzo.png';
      if (/^\/ecs(\/|$)/.test(p)) src = '/ecsitzo.jpeg';
      else if (/^\/hrms(\/|$)/.test(p)) src = '/ecsitzo.jpeg';
      else if (/^(\/food)?\/restaurant(\/|$)/.test(p)) src = '/restaurantitzo.jpeg';
      else if (/^(\/food)?\/delivery(\/|$)/.test(p)) src = '/deliveryitzo.jpeg';
      else if (/^\/seller(\/|$)/.test(p)) src = '/selleritzo.jpeg';
      var img = document.getElementById('initial-splash-img');
      if (img) img.src = src;
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
  <script>
    // Wait until the main content has loaded
    window.addEventListener('load', () => {
      // Add a slight delay to ensure React has painted
      setTimeout(() => {
        const splash = document.getElementById('initial-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 600);
        }
      }, 100);
    });
  </script>
</body>

</html>
